name: macOS build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Core and native installer tests
        run: swift test --jobs 2 --configuration release
      - name: Historical installer tests
        run: python3 -m unittest discover -s Tests/DeviceSetupTests -v
      - name: Build development app
        run: ./script/build_and_run.sh --build-only
      - name: Archive development app
        run: ditto -c -k --sequesterRsrc --keepParent 'dist/FX Relay.app' dist/FX-Relay-development.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FX-Relay-development
          path: dist/FX-Relay-development.zip
          if-no-files-found: error
          retention-days: 14
